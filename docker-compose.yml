x-REACT_APP_DOMAIN: &REACT_APP_DOMAIN
  REACT_APP_DOMAIN: ${REACT_APP_DOMAIN}

x-MONGO_CONNECTION_STRING: &MONGO_CONNECTION_STRING
  MONGO_CONNECTION_STRING: ${MONGO_CONNECTION_STRING}

x-GROQ_API_KEY: &GROQ_API_KEY
  GROQ_API_KEY: ${GROQ_API_KEY} 

x-GOOGLE_API_KEY: &GOOGLE_API_KEY
  GOOGLE_API_KEY: ${GOOGLE_API_KEY}

x-GOOGLE_CX: &GOOGLE_CX
  GOOGLE_CX: ${GOOGLE_CX}

x-GROQ_GPT_MODEL: &GROQ_GPT_MODEL
  GROQ_GPT_MODEL: ${GROQ_GPT_MODEL}
####################################
version: '3'
services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    ports:
      - "5000:5000"
    environment:
      <<: [*REACT_APP_DOMAIN,*MONGO_CONNECTION_STRING,*GROQ_API_KEY,*GOOGLE_API_KEY,*GOOGLE_CX,*GROQ_GPT_MODEL]
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    ports:
      - "3000:3000"
    environment:
      <<: *REACT_APP_DOMAIN
    depends_on:
      - backend

